<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Medi_Q_Logo-1-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e20" />
    <title>MEDI-Q | Live Life Healthier</title>
    <meta name="description" content="MEDI-Q is Bangladesh's trusted importer of surgical instruments, nebulizers, and medical devices since 2012." />
    <meta property="og:title" content="MEDI-Q | Live Life Healthier" />
    <meta property="og:description" content="Quality medical goods for hospitals and clinics across Bangladesh." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/src/assets/Medi_Q_Logo-1-removebg-preview.png" />
    <meta property="og:url" content="https://medi-q.com" />
  </head>
  <body>
    <div id="root"></div>

    <!-- 
      A little help for the Netlify post-processing bots.
      Because this is a React SPA, Netlify won't see the form inside the JS.
      This hidden HTML form allows Netlify to parse the inputs and provision the backend endpoint.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
